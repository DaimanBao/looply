# Cấu hình CodeRabbit cho dự án
version: "2"

reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false # Tắt thơ ca cho chuyên nghiệp (tùy chọn)
  review_status: true
  collapse_walkthrough: false
  # Ép buộc bot luôn review tự động bỏ qua các giới hạn ngoại lệ
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "dev*"

language: "vi" # Đưa ra phản hồi và review bằng tiếng Việt

chat:
  auto_reply: true