name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck Angular source and templates
        run: npm exec -- ngc --project tsconfig.app.json --noEmit

      - name: Typecheck source and tests
        run: npm exec -- tsc --project tsconfig.spec.json --noEmit

      - name: Run unit and component tests
        run: npm test -- --watch=false

      - name: Build frontend for production
        run: npm run build -- --configuration production
