name: looply

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5
      - -c
      - max_slot_wal_keep_size=1GB

    environment:
      POSTGRES_USER: postgre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: looply_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgre -d looply_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: